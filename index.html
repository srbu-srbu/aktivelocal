<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>aktivelocal — Lite Local Events & WebMCP Superpowers</title>
    <meta name="description" content="A lite, agent-native local events website with WebMCP tools for autonomous recurring series and intelligent weekend planning." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- WebMCP Protocol Inline Definition & Tool Registration -->
    <script>
      (function() {
        window.WEBMCP_TOOLS = [
          {
            name: "get_active_profile",
            description: "Retrieves the active user profile including email, display name, and permanent location.",
            inputSchema: { type: "object", properties: {}, required: [] }
          },
          {
            name: "search_events",
            description: "Searches local events within a 50-mile radius for a given date and query string across Santa Clara, San Jose, Mountain View, Sunnyvale, and Milpitas.",
            inputSchema: {
              type: "object",
              properties: {
                query: { type: "string", description: "Search term (e.g. 'run', 'yoga', 'coffee')" },
                date: { type: "string", description: "ISO date string or YYYY-MM-DD for target day" },
                radius_miles: { type: "number", description: "Maximum radius in miles (default 50)" }
              },
              required: ["date"]
            }
          },
          {
            name: "get_event_details",
            description: "Fetches complete details, description, venue, and attendee list for a specific event ID.",
            inputSchema: {
              type: "object",
              properties: {
                event_id: { type: "string", description: "The unique event ID (e.g. 'evt-001')" }
              },
              required: ["event_id"]
            }
          },
          {
            name: "create_event",
            description: "Creates a single atomic local event on aktivelocal.",
            inputSchema: {
              type: "object",
              properties: {
                title: { type: "string", description: "Event title" },
                datetime: { type: "string", description: "ISO-8601 start date and time" },
                location: { type: "string", description: "Venue name and address" },
                description: { type: "string", description: "Details and agenda for the event" },
                duration_minutes: { type: "number", description: "Duration in minutes (default 60)" }
              },
              required: ["title", "datetime", "location"]
            }
          },
          {
            name: "rsvp_event",
            description: "RSVPs or cancels RSVP for the active user to a specific event.",
            inputSchema: {
              type: "object",
              properties: {
                event_id: { type: "string", description: "Event ID to RSVP to" },
                action: { type: "string", enum: ["rsvp", "cancel"], description: "Action to perform" }
              },
              required: ["event_id"]
            }
          },
          {
            name: "create_recurring_series",
            description: "Autonomous Agent Superpower: Synthesizes a weekly recurring event series across multiple weeks using atomic event creation tools.",
            inputSchema: {
              type: "object",
              properties: {
                title: { type: "string", description: "Base title of recurring series" },
                day_offset_start: { type: "number", description: "Day offset from today to start" },
                hour: { type: "number", description: "Hour of day in 24h format (e.g. 18)" },
                minute: { type: "number", description: "Minute of the hour (e.g. 30)" },
                weeks_count: { type: "number", description: "Number of consecutive weeks" },
                location: { type: "string", description: "Venue name and address" },
                description: { type: "string", description: "Event description" }
              },
              required: ["title", "day_offset_start", "hour", "weeks_count", "location"]
            }
          },
          {
            name: "plan_weekend_itinerary",
            description: "Autonomous Agent Superpower: Discovers events for Saturday/Sunday, balances morning/evening slots, checks distance, and auto-RSVPs.",
            inputSchema: {
              type: "object",
              properties: {
                target_weekend_day_offset: { type: "number", description: "Day offset for weekend (e.g. 2 for Saturday, 3 for Sunday)" },
                vibes: { type: "array", items: { type: "string" }, description: "Desired vibes" },
                auto_rsvp: { type: "boolean", description: "Whether to automatically RSVP" }
              },
              required: ["target_weekend_day_offset"]
            }
          }
        ];

        window.mcp = {
          name: "aktivelocal-webmcp",
          version: "1.0.0",
          description: "WebMCP Agent Tools for aktivelocal events platform",
          getTools: function() { return window.WEBMCP_TOOLS; },
          callTool: async function(req) {
            if (window.__executeWebMCPTool) {
              return await window.__executeWebMCPTool(req.name, req.parameters || req.arguments || req);
            }
            throw new Error("WebMCP handler initializing...");
          }
        };

        if (typeof navigator !== "undefined") {
          if (typeof navigator.modelContext?.registerTool === "function") {
            window.WEBMCP_TOOLS.forEach(function(tool) {
              try {
                navigator.modelContext.registerTool(tool, async function(args) {
                  return await window.mcp.callTool({ name: tool.name, parameters: args });
                });
              } catch(e) {}
            });
          } else {
            try {
              Object.defineProperty(navigator, "modelContext", {
                value: window.mcp,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch(e) {
              try { navigator.modelContext = window.mcp; } catch(e2) {}
            }
          }
        }
      })();
    </script>
  </head>
  <body class="bg-[#f8fafc] text-slate-900 min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
